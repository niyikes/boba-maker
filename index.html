<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>boba!!!!!!</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>

<h1 class="animate__animated animate__tada">make sum boba!</h1>

<div class="wrap">
  <div class="straw"></div>
  <div class="cup">
    <div class="milk" id="milk"></div>
    <div class="pearls" id="pearls"></div>
  </div>
</div>


<div class="controls">
  <label>
    boba: <span id="bobaVal"></span>
    <input type="range" id="boba" min="0" max="20" value="20">
  </label>

  <label>
    milk: <span id="milkVal"></span>%
    <input type="range" id="milkSlider" min="10" max="90" value="60">
  </label>

  <label>
    flavour
    <select id="flavour">
      <option value="taro">taro</option>
      <option value="matcha">matcha</option>
      <option value="strawberry">strawberry</option>
      <option value="brown sugar" selected>coffee</option>
      <option value="mango">mango</option>
    </select>
  </label>
</div>

<script src="script.js"></script>
</body>
</html>
